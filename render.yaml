services:
  - type: web
    name: llbert
    env: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile
    dockerContext: .
    envVars:
      - key: LLBERT_MODEL_PATH
        value: /app/output
      - key: LLBERT_DATA_PATH
        value: /app/training.csv
      - key: LLBERT_ALLOWED_ORIGINS
        value: "https://your-site.com"
