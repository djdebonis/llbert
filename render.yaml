services:
  - type: web
    name: llbert
    env: python
    plan: free
    region: oregon
    buildCommand: |
      pip install --upgrade pip
      pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.10"
      - key: LLBERT_MODEL_PATH
        value: ./output
      - key: LLBERT_DATA_PATH
        value: ./training.csv
      - key: LLBERT_ALLOWED_ORIGINS
        value: "https://your-site.com"
